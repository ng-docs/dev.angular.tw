    <p>當 Angular 執行時注入一個意圖用於 <code>multi: true</code> 的令牌，但卻發現了一個非陣列值時，它將丟擲此錯誤。例如，<a href="/api/core/ENVIRONMENT_INITIALIZER"><code>ENVIRONMENT_INITIALIZER</code></a> 的提供方式應為 <code>{provide: ENVIRONMENT_INITIALIZER, multi: true, useValue: () =&gt; {...}}</code>。</p>
