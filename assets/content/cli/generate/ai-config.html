<div class="docs-cli"><div class="docs-reference-cli-content"><header class="docs-reference-header"><span class="docs-reference-category">CLI</span><div class="docs-reference-title"><div><h1>生成 ai-config</h1><div class="docs-api-item-label type-command full">指令</div></div></div></header><div class="docs-code docs-reference-cli-toc"><pre class="docs-mini-scroll-track"><code><div class="shiki line cli">ng generate ai-config<button member-id="Options" class="shiki-ln-line-option">[options]</button></div></code></pre></div><div><p>為 Angular 專案生成 AI 設定檔案。此原理圖會建立設定檔案，幫助 AI 工具遵循 Angular 最佳實踐，從而提高 AI 生成程式碼和建議的質量。</p>
</div></div><div class="docs-reference-members"><h2 id="options" class="docs-reference-section-heading"><a href="#options" aria-label="Link to Options section" tabindex="-1">選項</a></h2><div class="docs-reference-member-card"><div class="docs-reference-card-body"><div class="docs-ref-content"><div class="docs-ref-option-and-description"><div class="docs-reference-option"><code>tool</code></div><div><p>指定要為其生成設定檔案的 AI 工具。這些檔案透過遵循最佳實踐來改進 AI 工具的輸出。</p>
</div></div><div class="docs-reference-type-and-default"><span>值型別</span><code>陣列</code><span>允許值</span><code>claude</code>, <code>copilot</code>, <code>cursor</code>, <code>gemini</code>, <code>jetbrains</code>, <code>none</code>, <code>windsurf</code><span>預設值</span><code>none</code></div></div></div></div></div></div>
